# Accordion main conductor lineup on xjq at a 100k budget.
# Pinned to main SHA 39667c8558b96d9d59adb6f25ec3c3a7bb295fdb (protocol v22,
# core/protocol.ts present => devmain-shaped checkout, routed to the resident
# host) via accordionRef — NOT the branch name, since accordionRef.mjs's
# resolveRefToSha re-resolves a branch ref at run time and would silently
# make two runs a week apart non-comparable under the same trial name.
#
# NOT COMPARABLE to devmain-conductors-xjq-100k, even though both are v22 and
# the budget/protectTokens/minutes shape matches: main and devmain have
# DIVERGED (main is 21 commits devmain lacks; devmain is 119 commits ahead of
# main) — same protocol version, different tree. Compare this trial only
# against other trials pinned to this exact accordionRef.
#
# Arms are every conductor id in core/conductor/registry.ts ENTRIES on main
# except one:
#   - none              raw baseline, no host attached (detached sentinel)
#   - compaction-naive   in-process
#   - handoff            in-process
#   - doorman            in-process
#   - thermocline        spawn/out-of-process
# The old main ids (builtin, keel, sliding-window, cold-score) no longer
# exist on this SHA — see builtin-vs-naive-xjq-100k-v3.yaml / keel-vs-sliding-
# xjq-100k.yaml for the pre-divergence lineup they belonged to.
#
# triptych is DELIBERATELY EXCLUDED: it declares requiredModules
# ["web-tree-sitter", "tree-sitter-wasms/package.json"] and reports readiness
# "unavailable" in a bellows worktree, because bellows worktree provisioning
# (src/runner/accordionRef.mjs) deliberately never runs `npm install`.
# Including it would just be a guaranteed-unavailable arm burning a room slot
# for no data.
#
# Bare conductor ids (not "external:<id>") throughout: this is a devmain-
# shaped (non-legacy, protocol.ts-present) checkout, so run.mjs's
# autoUpgradeArmDispatch returns dispatch unchanged for every in-process id —
# the resident v22 host resolves spawn-kind conductors like thermocline
# itself. "external:thermocline" is legacy-checkout-only dispatch syntax and
# would throw before pi even starts.
#
# ONLY cap: 90-minute wall clock (turns/costUsd absurdly high so they can
# never bind; totalTokens omitted entirely) — matches the devmain-conductors
# shape so a healthy run ends only on agent-finish or the clock.
trial: main-conductors-xjq-100k
problems: xjq
model: token-router:deepseek/deepseek-v4-flash
thinkingLevel: medium
accordionRef: 39667c8558b96d9d59adb6f25ec3c3a7bb295fdb
budget: 100000
protectTokens: 10000
arms:
  - conductor: none
  - conductor: compaction-naive
  - conductor: handoff
  - conductor: doorman
  - conductor: thermocline
seeds: 1
caps:
  costUsd: 1000000     # inert ($0 pricing) + absurdly high — can never fire
  turns: 100000000     # effectively no turn cap
  minutes: 90          # THE ONLY REAL CAP
  # totalTokens: intentionally omitted — no token cap
parallel: 2            # matches existing 2-arm trials' practical concurrency;
                        # 5 arms just means more sequential batches, not more
                        # in-flight runs than the machine has handled before
room:
  create: true
