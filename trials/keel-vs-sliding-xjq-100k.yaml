# keel vs sliding-window on xjq at 100k budget — SAME fingerprint as the v3
# builtin/compaction-naive run, so the report groups all four conductors together.
# ONLY cap: 90-minute wall clock (turns/costUsd absurdly high, totalTokens omitted).
# keel runs without the bear/TTC key: its host.complete deep-zone uses the agent's
# own model (free relay), and its Bear-2 comment squeeze no-ops when the host has
# no compress capability. sliding-window is fully deterministic.
trial: keel-vs-sliding-xjq-100k
problems: xjq
model: token-router:deepseek/deepseek-v4-flash
thinkingLevel: medium
budget: 100000
protectTokens: 10000
arms:
  - conductor: keel
  - conductor: sliding-window
seeds: 1
caps:
  costUsd: 1000000     # inert ($0 pricing) + absurdly high — can never fire
  turns: 100000000     # effectively no turn cap
  minutes: 90          # THE ONLY REAL CAP
  # totalTokens: intentionally omitted — no token cap
parallel: 2
room:
  create: true
